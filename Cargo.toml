[package]
name = "afniru"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A Rust rebuild of the AFNI volume viewer."
license = "MIT OR Apache-2.0"

[dependencies]
afni-core = { git = "https://github.com/pmolfese/afni-core", branch = "main" }
afni-io = { git = "https://github.com/pmolfese/afni-io", branch = "main" }
# Smooth text in saved images (the font egui already carries).
ab_glyph = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Versions track sumaru (egui 0.36.2 / wgpu 30). eframe's default features
# already select the wgpu backend; `persistence` is for workspace storage.
eframe = { version = "0.36.2", features = ["persistence"] }
egui = "0.36.2"
egui_plot = "0.37"
egui-phosphor = { version = "0.14", default-features = false, features = ["regular"] }
glam = "0.33"
# PNG files for saved slices and montages (the version eframe already uses).
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot"] }

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 2
